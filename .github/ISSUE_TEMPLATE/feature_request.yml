name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like Kanjo to behave.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: Kanjo never stores prompt or response text and never makes outbound network connections. Requests that need either cannot be accepted.
      options:
        - label: My request works without storing conversation text and without outbound network traffic.
          required: true
