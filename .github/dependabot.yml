version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # D-005 in docs/decisions.md: @types/node stays on the Node major CI uses (NODE_VERSION in ci.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # D-004 in docs/decisions.md: svelte-check supports only TypeScript 5 and 6.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
