name: Release

# Builds, packages, signs and publishes a release when a version tag is pushed.
# See docs/release.md for the toolchain choices, verification commands and what
# is and is not reproducible. No caches are used here, so a poisoned cache from
# another workflow cannot reach a release artifact.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.98.1"
  NODE_VERSION: "24"

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Check the tag against the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $TAG does not match workspace version $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

  web:
    name: Web UI
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build ${{ matrix.target }}
    needs: [meta, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    env:
      TARGET: ${{ matrix.target }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          components=""
          # llvm-objdump lists the DLLs kanjo.exe imports (scripts/check-binary.sh).
          if [ "$RUNNER_OS" = Windows ]; then components="--component llvm-tools"; fi
          # shellcheck disable=SC2086
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET" $components
          rustup default "$RUST_TOOLCHAIN"
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          # musl-gcc searches only musl's own headers, but OpenSSL's secure heap
          # includes <linux/mman.h>. Expose just the kernel UAPI headers, which do
          # not depend on the libc, instead of the whole glibc include tree.
          inc="$RUNNER_TEMP/musl-kernel-headers"
          mkdir -p "$inc"
          ln -s /usr/include/linux "$inc/linux"
          ln -s /usr/include/asm-generic "$inc/asm-generic"
          ln -s "/usr/include/$(gcc -print-multiarch)/asm" "$inc/asm"
          target_env=$(printf '%s' "$TARGET" | tr '-' '_')
          echo "CC_$target_env=musl-gcc" >> "$GITHUB_ENV"
          echo "CFLAGS_$target_env=-isystem $inc" >> "$GITHUB_ENV"
      - name: Use Strawberry Perl for the vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci-windows-perl.ps1
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-auditable@0.7.8,cargo-audit@0.23.0
      - name: Build
        run: scripts/release-build.sh
      - name: Check the binary
        run: |
          bin="target/$TARGET/release/kanjo"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          scripts/check-binary.sh "$bin" "$TARGET"
          scripts/cargo-audit.sh bin "$bin"
          mkdir -p out
          cp "$bin" out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package, checksums and SBOM
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-cyclonedx@0.5.10
      - name: Archives
        run: |
          scripts/release-package.sh bins dist
          cp install/install.sh install/install.ps1 dist/
          scripts/installer-repo-url.sh dist/install.sh dist/install.ps1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: SBOMs
        run: |
          for dir in bins/bin-*; do
            target="${dir#bins/bin-}"
            marker=$(mktemp)
            cargo cyclonedx --format json --spec-version 1.5 --all --target "$target"
            found=$(find crates/kanjo-cli -maxdepth 1 -name '*.cdx.json' -newer "$marker")
            count=$(printf '%s\n' "$found" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::expected one SBOM for kanjo, found $count"
              exit 1
            fi
            mv "$found" "dist/kanjo-$VERSION-$target.cdx.json"
            find crates -maxdepth 2 -name '*.cdx.json' -delete
            rm -f "$marker"
          done
      - name: Checksums
        working-directory: dist
        run: |
          LC_ALL=C sha256sum kanjo-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - name: Homebrew formula and WinGet manifests
        run: |
          # Both are generated from SHA256SUMS, so they cannot be listed in it; the
          # build provenance attestation of the sign job covers them instead.
          KANJO_REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" scripts/release-packages.sh dist
          cat dist/kanjo.rb
          unzip -l "dist/winget-manifests-$VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and attest
    needs: [meta, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: cosign (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Verify the signature the way the installers do
        run: |
          # The package job checked that both installers pin this repository
          # (scripts/installer-repo-url.sh), so this is the identity they will ask for.
          expected="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$expected/.github/workflows/release.yml@$GITHUB_REF" \
            dist/SHA256SUMS
      - name: minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY is not configured; skipping the minisign signature"
            exit 0
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig -t "kanjo $VERSION SHA256SUMS"
          rm -f "$key"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kanjo-*.tar.gz
            dist/kanjo-*.zip
            dist/kanjo-*.cdx.json
            dist/install.sh
            dist/install.ps1
            dist/kanjo.rb
            dist/winget-manifests-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [meta, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "kanjo $VERSION" --notes-file notes.md $prerelease dist/*
