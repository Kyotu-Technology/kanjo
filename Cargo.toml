[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Kyotu"]
repository = "https://github.com/kyotu/kanjo"
homepage = "https://github.com/kyotu/kanjo"

[workspace.dependencies]
kanjo-core = { path = "crates/kanjo-core" }
kanjo-ingest = { path = "crates/kanjo-ingest" }
kanjo-analytics = { path = "crates/kanjo-analytics" }
kanjo-alerts = { path = "crates/kanjo-alerts" }
kanjo-ops = { path = "crates/kanjo-ops" }
kanjo-setup = { path = "crates/kanjo-setup" }
kanjo-server = { path = "crates/kanjo-server" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
