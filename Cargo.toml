[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Kyotu Technology"]
repository = "https://github.com/Kyotu-Technology/kanjo"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
