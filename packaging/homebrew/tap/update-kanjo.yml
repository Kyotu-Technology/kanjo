name: Update kanjo

# Copies kanjo.rb from a Kanjo release into Formula/kanjo.rb once its build
# provenance attestation shows that the Kanjo release workflow built it for that
# tag. Uses only this repository's own GITHUB_TOKEN; see README.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0 (default: the latest release)"
        required: false
        default: ""
  schedule:
    - cron: "23 5 * * *"

permissions: {}

concurrency:
  group: update-kanjo
  cancel-in-progress: false

jobs:
  update:
    name: Update Formula/kanjo.rb
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: Kyotu-Technology/kanjo
    steps:
      - name: Find the release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag=$INPUT_TAG
          elif ! tag=$(gh release view --repo "$SOURCE_REPO" --json tagName --jq .tagName 2>"$RUNNER_TEMP/err"); then
            if grep -qi "not found" "$RUNNER_TEMP/err"; then
              echo "::notice::$SOURCE_REPO has no release yet; nothing to do"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/err" >&2
            exit 1
          fi
          case "$tag" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::not a release tag: $tag"; exit 1 ;;
          esac
          case "$tag" in
          *[!0-9A-Za-z.+-]*) echo "::error::not a release tag: $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download kanjo.rb and verify its attestation
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          dir="$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$SOURCE_REPO" --pattern kanjo.rb --dir "$dir"
          gh attestation verify "$dir/kanjo.rb" --repo "$SOURCE_REPO" \
            --signer-workflow "$SOURCE_REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
          if ! head -n 1 "$dir/kanjo.rb" | grep -qxF "class Kanjo < Formula"; then
            echo "::error::kanjo.rb of $TAG is not the Kanjo formula"
            exit 1
          fi
          if ! grep -qF "https://github.com/$SOURCE_REPO/releases/download/$TAG/kanjo-${TAG#v}-" "$dir/kanjo.rb"; then
            echo "::error::kanjo.rb of $TAG does not install the archives of $TAG"
            exit 1
          fi
      - name: Commit Formula/kanjo.rb when it changed
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          new="$RUNNER_TEMP/release/kanjo.rb"
          path=Formula/kanjo.rb
          sha=""
          if gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha > "$RUNNER_TEMP/sha" 2>/dev/null; then
            sha=$(cat "$RUNNER_TEMP/sha")
            gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$path" > "$RUNNER_TEMP/current.rb"
            if cmp -s "$RUNNER_TEMP/current.rb" "$new"; then
              echo "$path is already the formula of $TAG"
              exit 0
            fi
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="kanjo ${TAG#v}" -f content="$(base64 -w0 "$new")" ${sha:+-f sha="$sha"} \
            --jq .commit.html_url
