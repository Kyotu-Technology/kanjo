[package]
name = "kanjo-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
kanjo-core = { version = "0.1.0", path = "../kanjo-core" }
minisign-verify = "0.3"
rusqlite = { version = "0.43.0", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11"
tracing = "0.1.44"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
secret-service = { version = "6.0.0", features = ["crypto-rust"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring-core = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[lints]
workspace = true

[dev-dependencies]
kanjo-core = { path = "../kanjo-core", features = ["testkit"] }
minisign = "0.10"
tempfile = "3.27.0"
