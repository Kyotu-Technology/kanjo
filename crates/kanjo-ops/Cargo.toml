[package]
name = "kanjo-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
kanjo-core = { version = "0.1.0", path = "../kanjo-core" }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
minisign-verify = "0.3"
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
kanjo-core = { path = "../kanjo-core", features = ["testkit"] }
minisign = "0.10"
tempfile = "3.27.0"
