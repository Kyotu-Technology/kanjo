[package]
name = "kanjo-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
getrandom = "0.4"
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
kanjo-core = { version = "0.2.0-rc.1", path = "../kanjo-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
kanjo-core = { path = "../kanjo-core", features = ["testkit"] }
tempfile = "3.27.0"
