[package]
name = "kanjo-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
kanjo-core = { version = "0.1.0", path = "../kanjo-core" }
memchr = "2"
notify = "8.2"
rusqlite = { version = "0.43.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
kanjo-core = { path = "../kanjo-core", features = ["testkit"] }
kanjo-ops = { path = "../kanjo-ops" }
tempfile = "3"
